repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md
      - id: check-yaml
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --check
        language: system
        types_or:
          - ts
          - tsx
          - javascript
          - json
          - yaml
          - markdown
          - css
          - astro
        exclude: ^package-lock\.json$
      - id: eslint
        name: eslint
        entry: npx eslint --max-warnings=0
        language: system
        types_or:
          - ts
          - tsx
          - astro
        pass_filenames: true
      - id: typecheck
        name: typecheck
        entry: npm run typecheck
        language: system
        pass_filenames: false
        files: \.(ts|tsx|astro|json)$
