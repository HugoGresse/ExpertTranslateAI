name: dependabot-automerge

# Runs after each gate workflow finishes on a Dependabot branch. Whichever gate
# finishes last sees every check complete and merges; until then it does nothing.
on:
  workflow_run:
    workflows:
      - quality
      - security
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-24.04
    permissions:
      # contents to merge, pull-requests to read and merge the PR, actions to start the deploy.
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      PR: ${{ github.event.workflow_run.pull_requests[0].number }}
    steps:
      - name: merge the pull request once every check is green
        id: merge
        run: |
          set -euo pipefail
          if [ -z "$PR" ]; then
            echo "no pull request attached to this run"
            exit 0
          fi
          view=$(gh pr view "$PR" --json author,headRefOid,state,statusCheckRollup)
          author=$(jq -r '.author.login' <<<"$view")
          if [ "$author" != "app/dependabot" ] && [ "$author" != "dependabot" ]; then
            echo "PR #$PR is by $author, not Dependabot"
            exit 0
          fi
          if [ "$(jq -r '.state' <<<"$view")" != "OPEN" ]; then
            echo "PR #$PR is not open"
            exit 0
          fi
          if [ "$(jq -r '.headRefOid' <<<"$view")" != "$HEAD_SHA" ]; then
            echo "PR #$PR moved past $HEAD_SHA; the newer commit's checks decide"
            exit 0
          fi
          # Check runs carry status/conclusion, commit statuses carry state.
          pending=$(jq '[.statusCheckRollup[] | select((.status // "COMPLETED") != "COMPLETED" or (.state // "") == "PENDING" or (.state // "") == "EXPECTED")] | length' <<<"$view")
          failed=$(jq '[.statusCheckRollup[] | select((.conclusion // "SUCCESS" | IN("SUCCESS", "SKIPPED", "NEUTRAL") | not) or ((.state // "SUCCESS") | IN("SUCCESS", "PENDING", "EXPECTED") | not))] | length' <<<"$view")
          echo "PR #$PR: $pending pending, $failed not green"
          if [ "$pending" -gt 0 ] || [ "$failed" -gt 0 ]; then
            exit 0
          fi
          gh pr merge "$PR" --squash --delete-branch --match-head-commit "$HEAD_SHA"
          echo "merged=true" >> "$GITHUB_OUTPUT"
      # A merge made with GITHUB_TOKEN does not trigger push workflows, so start the deploy by hand.
      - name: deploy the merged dependencies
        if: steps.merge.outputs.merged == 'true'
        run: gh workflow run deploy.yaml --ref main
