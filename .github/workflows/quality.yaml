name: quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: install dependencies
        run: npm ci
      - name: install pre-commit
        run: pipx install pre-commit
      - name: run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure
      - name: run unit tests
        run: npm test
      - name: run the CLI through Node's type stripping
        run: node apps/cli/bin/eta.ts --help > /dev/null
      - name: boot the server through Node's type stripping
        run: |
          OPENROUTER_API_KEY=x ETA_SERVER_TOKEN=t PORT=8799 node apps/server/bin/eta-server.ts &
          sleep 3
          curl --fail --silent http://127.0.0.1:8799/api/health
          kill %1
      - name: install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: run end-to-end tests
        run: npm run test:e2e -w apps/web
        env:
          CI: 'true'
      - name: build the site
        run: npm run build
